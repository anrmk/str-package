name: Publish npm package

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OpenID Connect (OIDC) token exchange

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Note: Do NOT include registry-url or token options here

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        # No NODE_AUTH_TOKEN is needed; npm handles OIDC authentication automatically
        run: npm publish --access public --provenance